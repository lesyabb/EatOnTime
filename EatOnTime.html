<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EatOnTime</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f2;--sf:#fff;--ink:#17221d;--mu:#62706a;--ln:#dde3dc;--ac:#1f5e4b;--acs:#e3efe9;--hi:#b9791a;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--sf:#19231f;--ink:#e9efeb;--mu:#98a79f;--ln:#2a3731;--ac:#6fc2a5;--acs:#1e332b;--hi:#e0a54a;--on:#0d1a15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--sf:#19231f;--ink:#e9efeb;--mu:#98a79f;--ln:#2a3731;--ac:#6fc2a5;--acs:#1e332b;--hi:#e0a54a;--on:#0d1a15;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
main{max-width:760px;margin:0 auto;padding:28px 20px 64px}
.logo{font:600 20px Fraunces,Georgia,serif;letter-spacing:.2px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.hero{text-align:center;padding:40px 0 28px}
.hero h1{font-size:clamp(40px,8vw,64px)}
.hero p{color:var(--mu);font-size:19px;margin:10px 0 0}
.menu{display:grid;grid-template-columns:120px 1fr;gap:18px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.pic{display:grid;place-items:center;border-radius:10px;font-size:44px;background:var(--acs);aspect-ratio:1;align-self:start}
.menu h2{font-size:26px}
.menu p{margin:6px 0;color:var(--mu)}
.dishes{font-size:15px;color:var(--ink)}
.dur{font-weight:600;font-size:15px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:10px 20px;font-weight:600}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ln)}
.menu .btn{margin-top:8px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--ink);padding:28px;width:min(380px,92vw);text-align:center}
dialog::backdrop{background:rgba(10,20,15,.55)}
dialog h2{font-size:26px;margin-bottom:18px}
dialog label{display:block;font-weight:600;margin:16px 0 8px}
.x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:24px;color:var(--mu)}
.step{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.step button{width:48px;border:0;background:var(--acs);color:var(--ac);font-size:22px}
.step output{min-width:64px;display:grid;place-items:center;font-size:22px;font-weight:600}
.hint{display:block;color:var(--mu);font-size:13px;margin-top:6px}
input[type=time]{font:inherit;font-size:20px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
dialog .btn{margin-top:26px;width:100%;padding:13px;font-size:17px}
.top{display:flex;justify-content:space-between;align-items:center}
.start{text-align:center;padding:36px 16px 30px}
.start small{display:block;color:var(--mu);font-size:17px}
.start .t{font:600 clamp(56px,16vw,104px)/1 Fraunces,Georgia,serif;color:var(--hi);margin:6px 0 10px;font-variant-numeric:lining-nums}
.start .s{color:var(--mu)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-top:8px}
.tabs button{flex:1;background:none;border:0;padding:12px 6px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ac);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px;margin-top:16px}
.rec{display:grid;grid-template-columns:200px 1fr;gap:22px}
.rec .pic{font-size:72px;aspect-ratio:4/3}
.rec h2{font-size:26px;margin-bottom:4px}
.meta{color:var(--mu);font-size:14px;margin:0 0 14px}
h3{font-size:20px;margin-bottom:10px}
ul{list-style:none;padding:0;margin:0}
.ing li{padding:5px 0}
.ing label,.tl label{display:flex;gap:10px;align-items:baseline;cursor:pointer}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px;flex:none;transform:translateY(3px)}
.ing input:checked+span,.tl input:checked~span{text-decoration:line-through;color:var(--mu)}
details{margin-top:16px}
summary{cursor:pointer;font-weight:600;color:var(--ac)}
ol{padding-left:22px;margin:10px 0 0}
ol li{padding:3px 0}
ol small{color:var(--mu)}
.tl{position:relative;margin-top:6px}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.tl li:first-child{border-top:0}
.tl time{font:600 19px Fraunces,Georgia,serif;font-variant-numeric:lining-nums}
.tl .d{color:var(--mu);font-size:14px}
.tl .mk{background:var(--acs);border-radius:8px;padding:10px 8px;margin:4px -8px;border:0}
.tl .mk strong{color:var(--ac)}
.tip{display:block;color:var(--mu);font-size:14px;margin-top:3px}
.left{font-weight:600;font-size:18px;margin-top:16px}
.bar{height:6px;border-radius:3px;background:var(--ln);max-width:320px;margin:8px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.pre{background:var(--acs);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.hide{display:none}
@media(max-width:560px){.menu{grid-template-columns:84px 1fr}.pic{font-size:32px}.rec{grid-template-columns:1fr}.rec .pic{aspect-ratio:3/1;font-size:56px}}
@media(prefers-reduced-motion:no-preference){.start .t{animation:pop .5s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

<label for="g">Počet hostů</label>
<div class="step"><button aria-label="Ubrat hosta" onclick="chg(-1)">−</button><output id="g">4</output><button aria-label="Přidat hosta" onclick="chg(1)">+</button></div>
<span class="hint">maximum je 12</span>
<label for="tm">Vše hotovo v (příchod hostů)</label>
<input type="time" id="tm" value="18:00">
<button class="btn" onclick="gen()">Vygenerovat plán</button>
</dialog>

function home(){plan=null;
 app.innerHTML=`<div class="logo">EatOnTime</div><div class="hero"><h1>EatOnTime</h1><p>Co budeme dnes vařit?</p></div>`+
 M.map((m,i)=>{const[a,z]=span(m.h);return`<article class="menu"><div class="pic" aria-hidden="true">${m.e}</div><div><h2>Menu ${i+1}: ${m.n}</h2><p class="dishes">${m.d.map(k=>R[k].n).join(", ")}</p><p class="dur">Doba vaření: cca ${dur(Math.round((z-a)/5)*5)}</p><button class="btn" onclick="pick(${i})">Vybrat</button></div></article>`}).join("");
 scrollTo(0,0)}
function pick(i){sel=i;dlg.showModal()}
function chg(d){guests=Math.min(12,Math.max(1,guests+d));$("#g").textContent=guests}
function gen(){const v=$("#tm").value;if(!v){$("#tm").focus();return}
 const[h,m]=v.split(":").map(Number);plan={T:h*60+m};done=new Set();dlg.close();tab=1;view();scrollTo(0,0)}
function view(){const m=M[sel],T=plan.T,[a,z]=span(m.h),sh=T-z,rk=R[m.d[tab]],fx=t=>t.replace("Smíchat a podat hlavní chod","Smíchat špagety s pancettou a žloutkovou směsí").replace(/ a podat \(/," (").replace(/ a podat$/,"");
 const rows=m.h.filter(x=>x[2]).map((x,i)=>`<li><time>${clock(x[0]+sh)}</time><label><input type="checkbox" ${done.has(i)?"checked":""} onchange="tick(${i},this.checked)"><span>${fx(x[1])} <span class="d">(${x[2]} min)</span><span class="tip">${TIP[sel][i]}</span></span></label></li>`).join("")+`<li class="mk"><time>${clock(T)}</time><span><strong>Hosté dorazili, vše je hotové.</strong> Teplá jídla držte v troubě na 80 °C, dezert v lednici.</span></li>`;
 app.innerHTML=`<div class="top"><div class="logo">EatOnTime</div><button class="btn ghost" onclick="home()">Změnit menu</button></div>
 <section class="start"><small>Začněte vařit v</small><div class="t">${clock(a+sh)}</div><div class="s">Menu ${sel+1}: ${m.n} pro ${guests} ${guests===1?"osobu":guests<5?"osoby":"osob"}. Vše bude hotové v ${clock(T)}, než hosté dorazí.</div><div class="left" id="left"></div><div class="bar"><i id="bar"></i></div></section>
 <div class="tabs" role="tablist">${COURSES.map((c,i)=>`<button role="tab" aria-selected="${i===tab}" onclick="tab=${i};view()">${c}</button>`).join("")}</div>
 <section class="card rec"><div class="pic" aria-hidden="true">${rk.e}</div><div><h2>${rk.n}</h2><p class="meta">${rk.t}. ${rk.p}</p>
 <h3>Ingredience</h3><ul class="ing">${rk.i.map(x=>`<li><label><input type="checkbox"><span>${x[0]}${x[1]?`: <strong>${qty(x[1],x[2])}</strong>`:" dle chuti"}</span></label></li>`).join("")}</ul></div>
 <details style="grid-column:1/-1"><summary>Postup receptu</summary><ol>${rk.s.map(s=>{const[t,mn,w]=s.split("~");return`<li>${t} <small>(${mn>=60?dur(+mn):mn+" min"}${w?", souběžně s: "+w:""})</small></li>`}).join("")}</ol></details></section>
 <section class="card"><h3>Postup přípravy</h3><div class="pre">${m.pre[0]} <small>(${m.pre[1]} min aktivně ${m.pre[2]})</small></div><ul class="tl">${rows}</ul></section>`;upd()}
function upd(){const c=M[sel].h.filter(x=>x[2]),[a,z]=span(M[sel].h);let last=a;done.forEach(i=>{last=Math.max(last,c[i][0]+c[i][2])});const left=z-last;
$("#left").textContent=left>0?"Do hotového jídla zbývá "+dur(left):"Hotovo, můžete otevřít dveře hostům";$("#bar").style.width=(100-left/(z-a)*100)+"%"}
function tick(i,v){v?done.add(i):done.delete(i);upd()}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
home();
</script>
</body>
</html>
